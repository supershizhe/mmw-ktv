<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171126">
  <title>妙妙屋狂欢夜</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #f6f0ff; background: radial-gradient(ellipse at 20% 0%, #4a276b 0, transparent 55%), #171126; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 680px); padding: clamp(32px, 7vw, 72px); border: 1px solid #ffffff24; border-radius: 28px; background: #ffffff08; box-shadow: 0 24px 80px #0004; }
    .icon { font-size: 48px; }
    .brand { color: #d7b7ff; font-size: 15px; letter-spacing: .12em; margin-top: 24px; }
    h1 { font-size: clamp(40px, 9vw, 72px); line-height: 1.1; margin: 20px 0; letter-spacing: -.04em; }
    p { color: #c5bcd3; line-height: 1.8; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <span class="icon" role="img" aria-label="麦克风">🎤</span>
    <div class="brand">妙妙屋狂欢夜</div>
    <h1>Hello World.</h1>
    <p>官方网站正在准备中，敬请期待。</p>
  </main>
</body>
</html>
